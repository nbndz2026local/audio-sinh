<script>
const D={"secs": [{"short": "Bài 1", "title": "Khái quát về trao đổi chất và chuyển hóa năng lượng", "n": 16}, {"short": "Bài 2–3", "title": "Trao đổi nước và khoáng ở thực vật", "n": 30}, {"short": "Bài 4–5", "title": "Quang hợp ở thực vật", "n": 22}, {"short": "Bài 6–7", "title": "Hô hấp ở thực vật", "n": 19}, {"short": "Bài 8", "title": "Dinh dưỡng và tiêu hóa ở động vật", "n": 4}, {"short": "Tự luận", "title": "Phần tự luận Sinh học 11", "n": 5}], "items": [{"i": 0, "s": 0, "p": "Trắc nghiệm", "n": "Câu 1", "k": "mcq", "g": "", "q": "Sinh vật nào sau đây có phương thức sống dị dưỡng?", "o": ["A. Thực vật.", "B. Vi khuẩn lam.", "C. Tảo xoắn.", "D. Động vật."], "a": "D. Động vật.", "e": "Sinh vật dị dưỡng không tự tổng hợp chất hữu cơ từ chất vô cơ mà lấy chất hữu cơ từ sinh vật khác. Động vật thuộc nhóm dị dưỡng.", "b": []}, {"i": 1, "s": 0, "p": "Trắc nghiệm", "n": "Câu 2", "k": "mcq", "g": "", "q": "Sinh vật nào sau đây có phương thức sống tự dưỡng?", "o": ["A. Thực vật.", "B. Động vật.", "C. Nấm.", "D. Côn trùng."], "a": "A. Thực vật.", "e": "Thực vật có khả năng quang hợp tự tổng hợp chất hữu cơ nên thuộc nhóm tự dưỡng.", "b": []}, {"i": 2, "s": 0, "p": "Trắc nghiệm", "n": "Câu 3", "k": "mcq", "g": "", "q": "Cây xanh thu nhận quang năng để tổng hợp các chất hữu cơ từ các phân tử CO2 và nước nhờ?", "o": ["A. Hệ rễ", "B. Khí khổng.", "C. Chất diệp lục.", "D. Hệ vận chuyển."], "a": "C. Chất diệp lục.", "e": "Chất diệp lục có khả năng hấp thụ quang năng (năng lượng ánh sáng) để cung cấp cho quá trình quang hợp, giúp cây xanh tổng hợp các chất hữu cơ từ CO2 và nước.", "b": []}, {"i": 3, "s": 0, "p": "Trắc nghiệm", "n": "Câu 4", "k": "mcq", "g": "", "q": "Khi nói về vai trò của trao đổi chất và chuyển hóa năng lượng đối với sinh vật, phát biểu nào sau đây đúng?", "o": ["A. Nếu ngưng thực hiện trao đổi chất và năng lượng, sinh vật vẫn có thể tồn tại và phát triển được.", "B. Chất thải, chất độc hại hoặc dư thừa sinh ra từ quá trình chuyển hóa không gây độc cho cơ thể sinh vật.", "C. Sinh vật lấy các chất từ môi trường cung cấp cho quá trình tạo chất sống của cơ thể hình thành tế bào, cơ quan cơ thể...", "D. Quá trình trao đổi chất và chuyển hóa năng lượng giúp sinh vật tồn tại và phát triển."], "a": "D. Quá trình trao đổi chất và chuyển hóa năng lượng giúp sinh vật tồn tại và phát triển.", "e": "Trao đổi chất & chuyển hóa năng lượng duy trì sự sống và phát triển.", "b": []}, {"i": 4, "s": 0, "p": "Trắc nghiệm", "n": "Câu 7", "k": "mcq", "g": "", "q": "Tập hợp thứ tự nào sau đây thể hiện đúng dòng năng lượng trong quá trình chuyển hoá năng lượng ở sinh giới?\n(1) Năng lượng ánh sáng(2) ATP(3) Các hoạt động sống\n(4) Năng lượng hoá học (tích luỹ trong các chất hữu cơ)", "o": ["A. (1)→ (2)→ (4) → (3).", "B. (2)→ (1)→ (3) → (4).", "C. (1)→ (4)→ (2) → (3).", "D. (2)→ (4)→ (1) → (3)."], "a": "C. (1)→ (4)→ (2) → (3).", "e": "Năng lượng ánh sáng (1) -> Hóa năng chất hữu cơ (4) -> ATP (2) -> Hoạt động sống (3).", "b": []}, {"i": 5, "s": 0, "p": "Trắc nghiệm", "n": "Câu 11", "k": "mcq", "g": "", "q": "Để thực hiện quá trình trao đổi chất và chuyển hóa năng lượng, thực vật cần lấy những thành phần nào sau đây từ môi trường sống?\n(1). Chất khoáng.(2). Khí N2.(3). Nước.(4). Khí CO2(5). Năng lượng ánh sáng.", "o": ["A. (1) (3) (4) (5).", "B. (1) (2) (3) (5).", "C. (2) (3) (5).", "D. (1) (2) (3) (4)."], "a": "D. (1) (2) (3) (4).", "e": "Thực vật lấy khoáng, nước, CO2 và ánh sáng (N2 khí quyển không hấp thụ trực tiếp được).", "b": []}, {"i": 6, "s": 0, "p": "Trắc nghiệm", "n": "Câu 3", "k": "mcq", "g": "", "q": "Ở người, cơ quan nào sau đây làm nhiệm vụ thải CO2?", "o": ["A. Gan.", "B. Thận.", "C. Phổi.", "D. Tim."], "a": "C. Phổi.", "e": "Phổi thực hiện trao đổi khí thải CO2.", "b": []}, {"i": 7, "s": 0, "p": "Trắc nghiệm", "n": "Câu 4", "k": "mcq", "g": "", "q": "Ở người, cơ quan nào sau đây làm nhiệm vụ bài tiết nước tiểu?", "o": ["A. Gan.", "B. Thận.", "C. Phổi.", "D. Tim."], "a": "B. Thận.", "e": "Thận lọc máu tạo nước tiểu bài tiết chất độc.", "b": []}, {"i": 8, "s": 0, "p": "Trắc nghiệm", "n": "Câu 5", "k": "mcq", "g": "", "q": "Ở người, cơ quan nào sau đây làm nhiệm vụ phân hủy các chất độc hại?", "o": ["A. Gan.", "B. Thận.", "C. Phổi.", "D. Tim."], "a": "A. Gan.", "e": "Gan là cơ quan khử độc chính của cơ thể.", "b": []}, {"i": 9, "s": 0, "p": "Đúng/Sai", "n": "Câu 1 ý a", "k": "tf", "g": "Mỗi nhận định sau là đúng hay sai khi nói về vai trò trao đổi chất và chuyển hóa năng lượng ở sinh vật?", "q": "Nếu như cơ thể không thực hiện trao đổi chất và chuyển hóa năng lượng thì sinh vật vẫn tồn tại được.", "o": [], "a": "SAI", "e": "Ngừng trao đổi chất sinh vật sẽ chết.", "b": []}, {"i": 10, "s": 0, "p": "Đúng/Sai", "n": "Câu 1 ý b", "k": "tf", "g": "", "q": "Năng lượng tạo ra từ hô hấp tế bào (ATP) được sử dụng cho các hoạt động sống: vận động, sinh sản, cảm ứng, sinh trưởng và phát triển.", "o": [], "a": "ĐÚNG", "e": "ATP cung cấp cho mọi hoạt động sống.", "b": []}, {"i": 11, "s": 0, "p": "Đúng/Sai", "n": "Câu 1 ý c", "k": "tf", "g": "", "q": "Ở sinh vật : Quá trình chuyển hóa vật chất luôn kèm theo chuyển hóa năng lượng.", "o": [], "a": "ĐÚNG", "e": "Các phản ứng hóa học đều tích lũy hoặc giải phóng năng lượng đi kèm.", "b": []}, {"i": 12, "s": 0, "p": "Đúng/Sai", "n": "Câu 1 ý d", "k": "tf", "g": "", "q": "Nguồn năng lượng khởi đầu trong sinh giới là nhiệt năng.", "o": [], "a": "SAI", "e": "Nguồn năng lượng khởi đầu là quang năng.", "b": []}, {"i": 13, "s": 0, "p": "Trả lời ngắn", "n": "Câu 1", "k": "short", "g": "", "q": "Quá trình chuyển hóa năng lượng trong sinh giới trải qua mấy giai đoạn?", "o": [], "a": "3", "e": "3 giai đoạn: Tổng hợp -> Phân giải -> Huy động năng lượng.", "b": []}, {"i": 14, "s": 0, "p": "Trả lời ngắn", "n": "Câu 3", "k": "short", "g": "", "q": "Cho các dạng năng lượng: nhiệt năng, quang năng, cơ năng, hóa năng và động năng. Năng lượng được giải phóng trong dị hoá một phần sẽ được sinh vật sử dụng, phần còn lại cuối cùng cũng đều thoát ra ngoài dưới mấy dạng năng lượng kể trên?", "o": [], "a": "1", "e": "Thoát ra ngoài dưới 1 dạng duy nhất là Nhiệt năng.", "b": []}, {"i": 15, "s": 0, "p": "Trả lời ngắn", "n": "Câu 11", "k": "short", "g": "", "q": "Cho các sinh vật sau đây. Có bao nhiêu sinh vật tự dưỡng?\na, Cây chuối b, Vi khuẩn lam c, Nấm da đầu d, Tảo lục  e, Trùng giày f, Con bò g, Vi khuẩn trong ruột mối\nh, Rong đuôi chói, San hô k, Giun, sán", "o": [], "a": "4", "e": "4 sinh vật: Cây chuối, Vi khuẩn lam, Tảo lục, Rong đuôi chó.", "b": []}, {"i": 16, "s": 1, "p": "Trắc nghiệm", "n": "Câu 1", "k": "mcq", "g": "", "q": "Nguyên tố dinh dưỡng khoáng thiết yếu trong cây là nguyên tố", "o": ["A. thiếu nó cây không hoàn thành được chu trình sống.", "B. có thể thay thế bởi một nguyên tố khác khi cây cần sử dụng.", "C. tham gia gián tiếp vào quá trình chuyển hóa vật chất.", "D. chiếm hàm lượng lớn hơn các nguyên tố khác trong cơ thể"], "a": "A. thiếu nó cây không hoàn thành được chu trình sống.", "e": "Định nghĩa nguyên tố khoáng thiết yếu.", "b": []}, {"i": 17, "s": 1, "p": "Trắc nghiệm", "n": "Câu 2", "k": "mcq", "g": "", "q": "Có khoảng bao nhiêu nguyên tố được xem là nguyên tố khoáng thiết yếu ở thực vật?", "o": ["A. 50", "B. 92", "C. 17", "D. 25"], "a": "C. 17", "e": "Có khoảng 17 nguyên tố khoáng thiết yếu.", "b": []}, {"i": 18, "s": 1, "p": "Trắc nghiệm", "n": "Câu 3", "k": "mcq", "g": "", "q": "Những nguyên tố nào dưới đây thuộc nguyên tố vi lượng?", "o": ["A. Zn.", "B. Mg.", "C. K.", "D. S."], "a": "A. Zn.", "e": "Zn là nguyên tố vi lượng.", "b": []}, {"i": 19, "s": 1, "p": "Trắc nghiệm", "n": "Câu 4", "k": "mcq", "g": "", "q": "Ý nào sau đây không đúng khi nói về vai trò của nước đối với cơ thể thực vật?", "o": ["A. Thành phần cấu tạo nên tế bào.", "B. Là môi trường sống của thực vật thủy sinh.", "C. Là dung môi hòa tan muối khoáng và các chất hữu cơ trong cây.", "D. Cung cấp năng lượng cho các hoạt động của cây."], "a": "D. Cung cấp năng lượng cho các hoạt động của cây.", "e": "Nước không cung cấp năng lượng cho cây.", "b": []}, {"i": 20, "s": 1, "p": "Trắc nghiệm", "n": "Câu 5", "k": "mcq", "g": "", "q": "Nguyên tố dinh dưỡng khoáng thiết yếu trong cây là nguyên tố", "o": ["A. thiếu nó cây không hoàn thành được chu trình sống.", "B. có thể thay thế bởi một nguyên tố khác khi cây cần sử dụng.", "C. tham gia gián tiếp vào quá trình chuyển hóa vật chất.", "D. chiếm hàm lượng lớn hơn các nguyên tố khác trong cơ thể."], "a": "A. thiếu nó cây không hoàn thành được chu trình sống.", "e": "Nhắc lại định nghĩa nguyên tố khoáng thiết yếu.", "b": []}, {"i": 21, "s": 1, "p": "Trắc nghiệm", "n": "Câu 7", "k": "mcq", "g": "", "q": "Nguồn cung cấp nitrogen chủ yếu cho cây là", "o": ["A. không khí.", "B. đất.", "C. nước và không khí.", "D. nước."], "a": "B. đất.", "e": "Đất là nguồn cung cấp nitrogen chủ yếu cho cây dưới dạng NH4+ và NO3-.", "b": []}, {"i": 22, "s": 1, "p": "Trắc nghiệm", "n": "Câu 8", "k": "mcq", "g": "", "q": "Thiếu sắt (Fe) thì cây bị vàng, nguyên nhân vì sắt là", "o": ["A. thành phần cấu tạo diệp lục.", "B. enzyme xúc tác tổng hợp diệp lục.", "C. thành phần cấu tạo lục lạp.", "D. enzyme xúc tác cho quang hợp."], "a": "B. enzyme xúc tác tổng hợp diệp lục.", "e": "Sắt xúc tác các enzyme tổng hợp diệp lục.", "b": []}, {"i": 23, "s": 1, "p": "Trắc nghiệm", "n": "Câu 9", "k": "mcq", "g": "", "q": "\"Lá nhỏ, mềm, mầm đỉnh bị chết\" dấu hiệu thường thấy khi cây thiếu hụt nguyên tố khoáng nào ?", "o": ["A. Cl", "B. P", "C. Mg", "D. Ca"], "a": "D. Ca", "e": "Thiếu Ca làm mầm đỉnh bị chết.", "b": []}, {"i": 24, "s": 1, "p": "Trắc nghiệm", "n": "Câu 10", "k": "mcq", "g": "", "q": "Nguyên tố vi lượng chỉ cần với một hàm lượng rất nhỏ nhưng nếu không có nó thì cây sẽ còi cọc và có thể bị chết. Nguyên nhân là vì các nguyên tố vi lượng có vai trò?", "o": ["A. tham gia cấu trúc nên tế bào.", "B. hoạt hóa enzyme trong trao đổi chất.", "C. qui định áp suất thẩm thấu của dịch tế bào.", "D. thúc đẩy quá trình chín của quả và hạt."], "a": "B. hoạt hóa enzyme trong trao đổi chất.", "e": "Nguyên tố vi lượng đóng vai trò hoạt hóa enzyme.", "b": []}, {"i": 25, "s": 1, "p": "Trắc nghiệm", "n": "Câu 27", "k": "mcq", "g": "", "q": "Nguyên nhân nào sau đây làm tế bào lông hút luôn ưu trương so với dung dịch đất.\n(1) Rễ hấp thụ các ion khoáng từ đất và tích lũy các chất tan từ quá trình chuyển hóa vật chất.\n(2). Thoát hơi nước ở lá làm giảm lượng nước ở tế bào lông hút.\n(3). Rễ hấp thụ nước và tích lũy nước từ quá trình chuyển hóa vật chất.\n(4). Rễ tiết các chất làm phân giải các chất tan trong dung dịch đất.", "o": ["A. 1, 2.", "B. 1, 3", "C. 1, 4", "D. 2, 3."], "a": "A. 1, 2.", "e": "Gồm nguyên nhân 1 và 2.", "b": []}, {"i": 26, "s": 1, "p": "Trắc nghiệm", "n": "Câu 29", "k": "mcq", "g": "", "q": "Ở thực vật trên cạn, đặc điểm nào của rễ cây thích nghi với chức năng hấp thụ nước?", "o": ["A. Có các rễ hô hấp mọc từ các rễ bên và đâm thẳng từ dưới lên mặt đất.", "B. Rễ hô hấp có mô sống, tầng biền phát triển và có nhiều bì khổng.", "C. Dịch tế bào rễ có áp suất thẩm thấu rất cao.", "D. Rễ cây đâm sâu, lan rộng, hình thành khối lượng khổng lổ các lông hút."], "a": "D. Rễ cây đâm sâu, lan rộng, hình thành khối lượng khổng lổ các lông hút.", "e": "Rễ đâm sâu lan rộng tạo khối lượng khổng lồ lông hút.", "b": []}, {"i": 27, "s": 1, "p": "Trắc nghiệm", "n": "Câu 39", "k": "mcq", "g": "", "q": "Cây trên cạn khi bị ngập úng lâu ngày sẽ bị chết, có bao giải thích nào sau đây đúng?\nI. Thừa oxi hạn chế hô hấp và tích luỹ chất độc.\nII. Lông hút bị chết và không hình thành lông hút mới.\nIII. Cây sẽ hấp thụ được nước và khoáng quá nhiều.\nIV. Sẽ tăng quá trình lên men gây tích lũy độc tố, lông hút sẽ chết và không hình thành lông hút mới làm cho cây không được hút nước và khoáng.", "o": ["A. 1", "B. 2", "C. 3", "D. 4"], "a": "B. 2", "e": "Có 2 ý đúng: II và IV.", "b": []}, {"i": 28, "s": 1, "p": "Trắc nghiệm", "n": "Câu 82", "k": "mcq", "g": "", "q": "Ghép nội dung ở cột bên phải với nội dung ở cột bên trái để trở thành một câu có nội dung đúng về vận chuyển các chất trong cây:\n1. Dòng mạch gỗ\na. Động lực là lực đẩy (áp suất rễ), lực hút (thoát hơi nước ở lá), lực liên kết của nước.\nb. Động lực là chênh lệch gradiet nồng độ các chất.\n2. Dòng mạch rây\nc. Hướng vận chuyển: Rễ -> lá (một chiều).\nd. Hướng vận chuyển: Lá -> cơ quan nhận (hai chiều).", "o": ["A. 1-bc, 2-ad.", "B. 1-bd, 2-ac.", "C. 1-ac, 2-bd.", "D. 1-ad, 2-bc."], "a": "C. 1-ac, 2-bd.", "e": "1-ac, 2-bd.", "b": []}, {"i": 29, "s": 1, "p": "Trắc nghiệm", "n": "Câu 83", "k": "mcq", "g": "", "q": "Ghép nội dung ở cột bên phải với nội dung ở cột bên trái để trở thành một câu có nội dung đúng về thoát hơi nước ở lá:\n1. Qua bề mặt lá\na. Tốc độ nhanh, được điều chỉnh.\nb. Ảnh hưởng bởi độ tuổi của lá, điều kiện sống,...\n2. Qua khí khổng\nc. Ảnh hưởng bởi ánh sáng, sự stress,...\nd. Tốc độ chậm, khó điều chỉnh.", "o": ["A. 1-bc, 2-ad.", "B. 1-bd, 2-ac.", "C. 1-ac, 2-bd.", "D. 1-ad, 2-bc."], "a": "B. 1-bd, 2-ac.", "e": "1-bd, 2-ac.", "b": []}, {"i": 30, "s": 1, "p": "Đúng/Sai", "n": "Câu 9 ý a", "k": "tf", "g": "Khi nói về sự hút nước của cây, mỗi mệnh đề sau là đúng hay sai?", "q": "Trời lạnh, sức hút nước của cây giảm.", "o": [], "a": "ĐÚNG", "e": "Nhiệt độ thấp làm giảm hút nước.", "b": []}, {"i": 31, "s": 1, "p": "Đúng/Sai", "n": "Câu 9 ý b", "k": "tf", "g": "", "q": "Sức hút nước của cây mạnh hay yếu không phụ thuộc vào độ nhớt của chất nguyên sinh.", "o": [], "a": "SAI", "e": "Độ nhớt ảnh hưởng đến di chuyển của nước.", "b": []}, {"i": 32, "s": 1, "p": "Đúng/Sai", "n": "Câu 9 ý c", "k": "tf", "g": "", "q": "Độ nhớt của chất nguyên sinh tăng sẽ gây khó khăn cho sự chuyển dịch của nước, làm giảm khả năng hút nước của rễ.", "o": [], "a": "ĐÚNG", "e": "Chính xác.", "b": []}, {"i": 33, "s": 1, "p": "Đúng/Sai", "n": "Câu 9 ý d", "k": "tf", "g": "", "q": "Một trong các nguyên nhân rụng lá mùa đông do cây tiết kiệm nước vì hút được ít nước.", "o": [], "a": "ĐÚNG", "e": "Giảm diện tích thoát hơi nước.", "b": []}, {"i": 34, "s": 1, "p": "Đúng/Sai", "n": "Câu 15 ý a", "k": "tf", "g": "Mỗi nhận định sau là đúng hay sai khi nói về vai trò của thoát hơi nước?", "q": "Tạo lực hút đầu trên.", "o": [], "a": "ĐÚNG", "e": "Lực kéo chính.", "b": []}, {"i": 35, "s": 1, "p": "Đúng/Sai", "n": "Câu 15 ý b", "k": "tf", "g": "", "q": "Khí khổng mở cho CO2 khuếch tán vào lá cung cấp cho quang hợp.", "o": [], "a": "ĐÚNG", "e": "Cung cấp CO2 quang hợp.", "b": []}, {"i": 36, "s": 1, "p": "Đúng/Sai", "n": "Câu 15 ý c", "k": "tf", "g": "", "q": "Giúp hạ nhiệt độ của lá cây vào nhưng ngày nắng nóng.", "o": [], "a": "ĐÚNG", "e": "Làm mát lá.", "b": []}, {"i": 37, "s": 1, "p": "Đúng/Sai", "n": "Câu 15 ý d", "k": "tf", "g": "", "q": "Giải phóng O2 giúp điều hòa không khí.", "o": [], "a": "SAI", "e": "Giải phóng O2 là vai trò của quang hợp.", "b": []}, {"i": 38, "s": 1, "p": "Đúng/Sai", "n": "Câu 17 ý a", "k": "tf", "g": "Mỗi nhận định sau là đúng hay sai khi nói về vai trò của nitrogen trong cơ thể thực vật?", "q": "Tham gia điều tiết các quá trình sinh lí (enzyme, hormone,...).", "o": [], "a": "ĐÚNG", "e": "Cấu tạo enzyme và hormone.", "b": []}, {"i": 39, "s": 1, "p": "Đúng/Sai", "n": "Câu 17 ý b", "k": "tf", "g": "", "q": "Tham gia cấu tạo bào và cơ thể thực vật (protein, nucleic acid, diệp lục, ATP,...).", "o": [], "a": "ĐÚNG", "e": "Đại lượng cấu trúc quan trọng.", "b": []}, {"i": 40, "s": 1, "p": "Đúng/Sai", "n": "Câu 17 ý c", "k": "tf", "g": "", "q": "Tham gia giữ cân bằng nước, đóng mở khí khổng.", "o": [], "a": "SAI", "e": "K+ có vai trò chính giữ cân bằng nước.", "b": []}, {"i": 41, "s": 1, "p": "Đúng/Sai", "n": "Câu 17 ý d", "k": "tf", "g": "", "q": "Nitrogen là nguyên tố dinh dưỡng khoáng thiết yếu.", "o": [], "a": "ĐÚNG", "e": "Chính xác.", "b": []}, {"i": 42, "s": 1, "p": "Trả lời ngắn", "n": "Câu 9", "k": "short", "g": "", "q": "Có bao nhiêu biện pháp sau giúp cho bộ rễ cây phát triển?\n(1) Phơi ải đất, cày sâu, bừa kĩ.   (2) Tưới đủ nước và bón phân hữu cơ cho đất.\n(3) Tăng cường bón phân hóa học cho đất. (4) Vun gốc và xới đất cho cây.", "o": [], "a": "3", "e": "Gồm 3 biện pháp đúng: 1, 2, 4.", "b": []}, {"i": 43, "s": 1, "p": "Trả lời ngắn", "n": "Câu 10", "k": "short", "g": "", "q": "Cho các con đường: gian bào, mạch gỗ, mạch rây, biểu bì và tế bào chất. Nước và chất khoáng được vận chuyển từ lông hút vào mạch gỗ của rễ theo mấy con đường?", "o": [], "a": "2", "e": "2 con đường: Gian bào và Tế bào chất.", "b": []}, {"i": 44, "s": 1, "p": "Trả lời ngắn", "n": "Câu 13", "k": "short", "g": "", "q": "Trong các lực sau đây: Lực đẩy, lực kéo của lá, lực di chuyển của các phân tử nước và lực liên kết, có bao nhiêu loại là động lực của dòng mạch gỗ?", "o": [], "a": "3", "e": "Gồm 3 động lực chính: Lực đẩy, Lực kéo, Lực liên kết.", "b": []}, {"i": 45, "s": 1, "p": "Trả lời ngắn", "n": "Câu 17", "k": "short", "g": "", "q": "Một học sinh đã chỉ ra các hậu quả khi bón liều lượng phân bón hóa học cao quá mức cần thiết cho cây như sau:\n1. Gây độc hại đối với cây.\n2. Gây ô nhiễm môi trường.\n3. Làm đất đai phì nhiêu nhưng cây không hấp thụ được hết.\n4. Dư lượng phân bón sẽ làm xấu lí tính của đất, giết chết các vi sinh vật có lợi. Có bao nhiêu ý giải thích hợp lí?", "o": [], "a": "3", "e": "Gồm 3 ý hợp lý: 1, 2, 4.", "b": []}, {"i": 46, "s": 2, "p": "Trắc nghiệm", "n": "Câu 6", "k": "mcq", "g": "", "q": "Carôtenôit có nhiều trong mẫu vật nào sau đây?", "o": ["A. Củ khoai mì", "B. Lá xà lách", "C. Lá xanh", "D. Củ cà rốt."], "a": "D. Củ cà rốt.", "e": "Carotenoid có nhiều trong củ cà rốt, quả gấc, cà chua.", "b": []}, {"i": 47, "s": 2, "p": "Trắc nghiệm", "n": "Câu 11", "k": "mcq", "g": "", "q": "Nhóm cây nào sau đây thuộc nhóm thực vật CAM?", "o": ["A. Dứa, xương rồng, thuốc bỏng.", "B. Lúa, sắn, đậu tương.", "C. Dứa, lúa, cao lương.", "D. Mía, rau dền, cao lương."], "a": "A. Dứa, xương rồng, thuốc bỏng.", "e": "Dứa, xương rồng, thuốc bỏng thuộc CAM.", "b": []}, {"i": 48, "s": 2, "p": "Trắc nghiệm", "n": "Câu 12", "k": "mcq", "g": "", "q": "Pha sáng quang hợp cung cấp cho pha tối sản phẩm nào sau đây?", "o": ["A. H2O và O2.", "B. CO2 và ATP.", "C. Năng lượng ánh sáng.", "D. ATP và NADPH."], "a": "D. ATP và NADPH.", "e": "Cung cấp ATP và NADPH cho pha tối.", "b": []}, {"i": 49, "s": 2, "p": "Trắc nghiệm", "n": "Câu 13", "k": "mcq", "g": "", "q": "Khi nói về quang hợp ở thực vật, có bao nhiêu phát biểu sau đây đúng?", "o": ["A. Phân tử O2 được giải phóng trong quá trình quang hợp có nguồn gốc từ phân tử H2O.", "B. Pha sáng chuyển hóa năng lượng của ánh sáng thành năng lượng trong NADP+, ADP+", "C. Pha sáng diễn ra trong chất nền (stroma) của lục lạp.", "D. Pha tối cung cấp NADP+, ADP+ và glucôzơ cho pha sáng."], "a": "A. Phân tử O2 được giải phóng trong quá trình quang hợp có nguồn gốc từ phân tử H2O.", "e": "O2 giải phóng hoàn toàn từ quang phân li nước.", "b": []}, {"i": 50, "s": 2, "p": "Trắc nghiệm", "n": "Câu 16", "k": "mcq", "g": "", "q": "Pha tối của quá trình quang hợp ở hai nhóm thực vật C4 và CAM không có chung đặc điểm nào sau đây?", "o": ["A. Sản phẩm cố định CO2 đầu tiên là hợp chất 4C.", "B. Trải qua chu trình Canvin.", "C. Diễn ra trong lục lạp của cùng một loại tế bào thịt lá.", "D. Chất nhận CO2 đầu tiên là phottphoenolpiruvic."], "a": "C. Diễn ra trong lục lạp của cùng một loại tế bào thịt lá.", "e": "Ở C4 diễn ra ở 2 loại tế bào, CAM diễn ra trong cùng 1 loại tế bào thịt lá.", "b": []}, {"i": 51, "s": 2, "p": "Trắc nghiệm", "n": "Câu 26", "k": "mcq", "g": "", "q": "Khi nói về quang hợp ở thực vật, có bao nhiêu phát biểu sau đây đúng?\nI. Phân tử O2 được giải phóng trong quá trình quang hợp có nguồn gốc từ phân tử H2O.\nII. Để tổng hợp được 1 phân tử glucôzơ thì pha tối phải sử dụng 6 phân tử CO2.\nIII. Pha sáng cung cấp ATP và NADPH cho pha tối.\nIV. Pha tối cung cấp NADP+ và glucôzơ cho pha sáng.", "o": ["A. 3", "B. 1", "C. 4", "D. 2"], "a": "A. 3", "e": "Gồm 3 phát biểu đúng: I, II, III.", "b": []}, {"i": 52, "s": 2, "p": "Trắc nghiệm", "n": "Câu 52", "k": "mcq", "g": "", "q": "Để đạt năng suất cao trong trồng trọt, nông dân cần thực hiện bao nhiêu biện pháp sau đây?\nI. Cần đảm bảo mật độ gieo trồng nhằm cung cấp đủ ánh sáng cho cây.\nII. Cần bón phân đúng loại, đúng liều lượng, đúng thời điểm và đúng phương pháp.\nIII. Tăng cường bón phân vô cơ để đáp ứng nhu cầu dưỡng dưỡng của cây.\nIV. Cần tưới tiêu hợp lý nhằm đáp ứng nhu cầu nước của cây.", "o": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "a": "C. 3.", "e": "Gồm 3 biện pháp đúng: I, II, IV.", "b": []}, {"i": 53, "s": 2, "p": "Trắc nghiệm", "n": "Câu 66", "k": "mcq", "g": "", "q": "Điểm bù ánh sáng là cường độ ánh sáng mà ở đó, cường độ quang hợp", "o": ["A. lớn hơn cường độ hô hấp.", "B. cân bằng với cường độ hô hấp.", "C. nhỏ hơn cường độ hô hấp.", "D. lớn gấp 2 lần cường độ hô hấp."], "a": "B. cân bằng với cường độ hô hấp.", "e": "Cân bằng với cường độ hô hấp.", "b": []}, {"i": 54, "s": 2, "p": "Trắc nghiệm", "n": "Câu 67", "k": "mcq", "g": "", "q": "Điểm bão hòa ánh sáng là cường độ ánh sáng tối đa để cường độ quang hợp đạt", "o": ["A. cực đại.", "B. cực tiểu.", "C. mức trung bình", "D. trên mức trung bình."], "a": "A. cực đại.", "e": "Cực đại.", "b": []}, {"i": 55, "s": 2, "p": "Trắc nghiệm", "n": "Câu 68", "k": "mcq", "g": "", "q": "Điểm bão hòa CO2 là nồng độ CO2 đạt", "o": ["A. tối đa để cường độ quang hợp đạt tối thiểu.", "B. tối thiểu để cường độ quang hợp đạt cao nhất.", "C. tối đa để cường độ quang hợp đạt cao nhất.", "D. tối đa để cường độ quang hợp đạt mức trung bình."], "a": "C. tối đa để cường độ quang hợp đạt cao nhất.", "e": "Tối đa để quang hợp đạt cao nhất.", "b": []}, {"i": 56, "s": 2, "p": "Đúng/Sai", "n": "Câu 6 ý a", "k": "tf", "g": "Hiệu ứng nhà kính là một hiện tượng tăng nồng độ khí CO2 trong khí quyển do các nhà máy sản xuất, hoạt động giao thông, đốt cháy các nhiên liệu hóa thạch làm trái đất nóng lên, băng tan chảy, mực nước biển dâng cao và các loài sinh vật trên trái nguy cơ tuyệt chủng. Nhận định nào sau đúng hay sai khi nói về giải pháp làm giảm hiệu ứng nhà kính.", "q": "Trồng rừng phủ xanh đồi trọc để quang hợp làm giảm CO2.", "o": [], "a": "ĐÚNG", "e": "Hấp thụ CO2.", "b": []}, {"i": 57, "s": 2, "p": "Đúng/Sai", "n": "Câu 6 ý b", "k": "tf", "g": "", "q": "Ra qui định bảo vệ, xử lý mạnh các trường hợp phá rừng.", "o": [], "a": "ĐÚNG", "e": "Bảo vệ rừng.", "b": []}, {"i": 58, "s": 2, "p": "Đúng/Sai", "n": "Câu 6 ý c", "k": "tf", "g": "", "q": "Thực hiện làm mảng xanh xung quanh nhà để điều tiết vi khí hậu trong gia đình.", "o": [], "a": "ĐÚNG", "e": "Điều hòa vi khí hậu.", "b": []}, {"i": 59, "s": 2, "p": "Đúng/Sai", "n": "Câu 6 ý d", "k": "tf", "g": "", "q": "Tuyên truyền và giáo dục ý thức về giá trị và ích lợi của việc bảo vệ rừng.", "o": [], "a": "ĐÚNG", "e": "Nâng cao ý thức.", "b": []}, {"i": 60, "s": 2, "p": "Đúng/Sai", "n": "Câu 7 ý a", "k": "tf", "g": "Mỗi nhận định sau là đúng hay sai khi nói về pha sáng của quang hợp ở thực vật:", "q": "Nguyên liệu của pha sáng gồm carbohydrate và O2.", "o": [], "a": "SAI", "e": "Nguyên liệu gồm H2O, NADP+, ADP.", "b": []}, {"i": 61, "s": 2, "p": "Đúng/Sai", "n": "Câu 7 ý b", "k": "tf", "g": "", "q": "Sản phẩm của pha sáng gồm ATP, NADPH và O2.", "o": [], "a": "ĐÚNG", "e": "Chính xác.", "b": []}, {"i": 62, "s": 2, "p": "Đúng/Sai", "n": "Câu 7 ý c", "k": "tf", "g": "", "q": "Trong pha sáng, nguyên liệu được lấy từ môi người là O2.", "o": [], "a": "SAI", "e": "Nguyên liệu từ môi trường là H2O.", "b": []}, {"i": 63, "s": 2, "p": "Đúng/Sai", "n": "Câu 7 ý d", "k": "tf", "g": "", "q": "Sản phẩm của pha sáng không tham gia vào pha tối là O2.", "o": [], "a": "ĐÚNG", "e": "O2 thoát ra không khí.", "b": []}, {"i": 64, "s": 2, "p": "Trả lời ngắn", "n": "Câu 3", "k": "short", "g": "", "q": "Trong số các thực vật sau đây: dứa, xương rồng, thuốc bỏng. lúa, khoai, sắn, đậu. có bao nhiêu cây thuộc nhóm thực vật C3 ?\nlúa, khoai, sắn, đậu.", "o": [], "a": "4", "e": "4 cây: lúa, khoai, sắn, đậu.", "b": []}, {"i": 65, "s": 2, "p": "Trả lời ngắn", "n": "Câu 9", "k": "short", "g": "", "q": "Có bao nhiêu phát biểu đúng trong các phát biểu sau.\nCác biện pháp kỹ thuật và công nghệ tăng năng suất cây trồng dựa trên quang hợp thường áp dụng dựa trên cơ sở:\n1. Cải tạo tiềm năng cây trồng2. Tăng diện tích canh tác\n3. Tăng diện tích lá.4. Sử dụng hiệu quả nguồn sáng\n5. Tăng cường hô hấp cho cây.6. Tăng cường nguồn sáng", "o": [], "a": "4", "e": "Gồm 4 biện pháp đúng: 1, 3, 4, 6.", "b": []}, {"i": 66, "s": 2, "p": "Trả lời ngắn", "n": "Câu 13", "k": "short", "g": "", "q": "Trong số các chất sau đây: ATP, DNA, RNA, carbohydrate, amino acid và protein. Có bao nhiêu chất là sản phẩm của quang hợp chủ yếu khi diễn ra ở miền ánh sáng đỏ và xanh tím.", "o": [], "a": "2", "e": "Gồm 2 sản phẩm: Carbohydrate và Protein/Amino acid.", "b": []}, {"i": 67, "s": 2, "p": "Trả lời ngắn", "n": "Câu 14", "k": "short", "g": "", "q": "Nồng độ CO2 tối thiểu mà cây cần cho quang hợp là 0,008 – 0,01%, nồng độ % bao nhiêu thích hợp ?", "o": [], "a": "0.03%", "e": "Khoảng 0,03% đến 0,1%.", "b": []}, {"i": 68, "s": 3, "p": "Trắc nghiệm", "n": "Câu 1", "k": "mcq", "g": "", "q": "Hô hấp là quá trình", "o": ["A. oxi hóa các hợp chất hữu cơ thành O2 và H2O, đồng thời giải phóng năng lượng cần thiết cho các hoạt động sống của cơ thể.", "B. oxi hóa các hợp chất hữu cơ thành CO2 và H2O,đồng thời giải phóng năng lượng cần thiết cho các hoạt động sống của cơ thể.", "C. oxi hóa các hợp chất vô cơ thành CO2 và H2O, đồng thời giải phóng năng lượng cần thiết cho các hoạt động sống của cơ thể.", "D. khử các hợp chất hữu cơ thành CO2 và H2O, đồng thời giải phóng năng lượng."], "a": "B. oxi hóa các hợp chất hữu cơ thành CO2 và H2O,đồng thời giải phóng năng lượng cần thiết cho các hoạt động sống của cơ thể.", "e": "Oxi hóa chất hữu cơ thành CO2 và H2O giải phóng năng lượng.", "b": []}, {"i": 69, "s": 3, "p": "Trắc nghiệm", "n": "Câu 10", "k": "mcq", "g": "", "q": "Đâu không phải là vai trò của hô hấp ở thực vật?", "o": ["A. Tạo các sản phẩm trung gian.", "B. Tổng hợp các chất hữu cơ.", "C. Giải phóng năng lượng dạng nhiệt.", "D. Giải phóng năng lượng ATP."], "a": "B. Tổng hợp các chất hữu cơ.", "e": "Tổng hợp chất hữu cơ là vai trò của quang hợp.", "b": []}, {"i": 70, "s": 3, "p": "Trắc nghiệm", "n": "Câu 12", "k": "mcq", "g": "", "q": "Quá trình hô hấp ở thực vật có ý nghĩa gì?", "o": ["A. Tạo năng lượng cung cấp cho các hoạt động sống của tế bào và cơ thể.", "B. Đảm bảo cân bằng O2 và CO2 trong khí quyển.", "C. Làm sạch không khí.", "D. Chuyển hóa carbohydrate thành CO2 và H2O."], "a": "A. Tạo năng lượng cung cấp cho các hoạt động sống của tế bào và cơ thể.", "e": "Tạo năng lượng ATP cung cấp cho hoạt động sống.", "b": []}, {"i": 71, "s": 3, "p": "Trắc nghiệm", "n": "Câu 26", "k": "mcq", "g": "", "q": "Trong quá trình hô hấp hiếu khí, phân giải glucose, giai đoạn nào tạo ra nhiều ATP nhất?", "o": ["A. Chuỗi truyền electron.", "B. Chu trình Krebs .", "C. Đường phân.", "D. Tạo thành Acetyl – CoA."], "a": "A. Chuỗi truyền electron.", "e": "Chuỗi truyền electron hô hấp.", "b": []}, {"i": 72, "s": 3, "p": "Trắc nghiệm", "n": "Câu 27", "k": "mcq", "g": "", "q": "Trong quá trình hô hấp hiếu khí ở tế bào thực vật, sản phẩm cuối cùng là gì?", "o": ["A. CO2, H2O và ATP.", "B. Rượu ethanol (C2H5OH).", "C. Lactic acid (C3H6O3).", "D. Oxaloacetic acid (OAA)."], "a": "A. CO2, H2O và ATP.", "e": "CO2, H2O và ATP.", "b": []}, {"i": 73, "s": 3, "p": "Trắc nghiệm", "n": "Câu 28", "k": "mcq", "g": "", "q": "Quá trình phân giải tạo ra nhiều ATP nhất ở thực vật là:", "o": ["A. hô hấp hiếu khí.", "B. hô hấp kị khí.", "C. lên men.", "D. đường phân."], "a": "A. hô hấp hiếu khí.", "e": "Hô hấp hiếu khí.", "b": []}, {"i": 74, "s": 3, "p": "Trắc nghiệm", "n": "Câu 40", "k": "mcq", "g": "", "q": "Kết thúc phân giải hiếu khí, 1 phân tử glucose bị phân giải tạo bao nhiêu ATP?", "o": ["A. 26 – 28.", "B. 28 -30.", "C. 30-32.", "D. 36-38."], "a": "C. 30-32.", "e": "30 - 32 ATP.", "b": []}, {"i": 75, "s": 3, "p": "Trắc nghiệm", "n": "Câu 17", "k": "mcq", "g": "", "q": "Tại sao khi nhiệt độ môi trường tăng cao (trên 55oC) thì hô hấp không diễn ra?", "o": ["A. Vì do nhiệt độ cao ảnh hưởng đến quá trình tạo sản phẩm của quá trình hô hấp.", "B. Vì do nhiệt độ cao làm mất hoạt tính của enzym hô hấp.", "C. Vì nhiệt độ cao ảnh hưởng đến quá trình oxi hóa các chất hữu cơ trong cơ thể.", "D. Vì do nhiệt độ cao sẽ làm cường độ hô hấp tăng ảnh hưởng đến chất lượng của hạt, quả."], "a": "B. Vì do nhiệt độ cao làm mất hoạt tính của enzym hô hấp.", "e": "Làm biến tính mất hoạt tính enzyme hô hấp.", "b": []}, {"i": 76, "s": 3, "p": "Trắc nghiệm", "n": "Câu 24", "k": "mcq", "g": "", "q": "Phát biểu nào sau đây là sai khi nói về mối quan hệ giữa hô hấp và quang hợp?", "o": ["A. Hai quá trình diễn ra ngược nhau nhưng gắn bó mật thiết, không thể tách rời.", "B. Sản phẩm của quang hợp là nguyên liệu cho hô hấp và ngược lại.", "C. Hô hấp tích lũy năng lượng, còn quang hợp giải phóng năng lượng cho hoạt động sống.", "D. Quang hợp tổng hợp chất hữu cơ, hô hấp phân giải chất hữu cơ."], "a": "C. Hô hấp tích lũy năng lượng, còn quang hợp giải phóng năng lượng cho hoạt động sống.", "e": "Quang hợp tích lũy năng lượng, Hô hấp giải phóng năng lượng.", "b": []}, {"i": 77, "s": 3, "p": "Trắc nghiệm", "n": "Câu 8", "k": "mcq", "g": "", "q": "Rau, củ, quả được bảo quản trong ngăn mát sẽ tươi lâu hơn, lý do nào sau đây không đúng?", "o": ["A. Giảm nhiệt độ của thực phẩm, làm chậm lại quá trình sinh lý, sinh hóa và trao đổi chất của sản phẩm.", "B. Khi nhiệt độ giảm sẽ dẫn đến tăng cường hô hấp do đó làm giảm chất lượng rau, củ, quả.", "C. Khi nhiệt độ giảm ảnh hưởng đến đến hoạt tính của enzyme, hô hấp không diễn ra.", "D. Nhiệt độ lạnh thực phẩm hạn chế quá trình hô hấp nên không ít ảnh hưởng đến chất lượng sản phẩm."], "a": "B. Khi nhiệt độ giảm sẽ dẫn đến tăng cường hô hấp do đó làm giảm chất lượng rau, củ, quả.", "e": "Giảm nhiệt độ làm giảm hô hấp chứ không phải tăng.", "b": []}, {"i": 78, "s": 3, "p": "Đúng/Sai", "n": "Câu 3 ý a", "k": "tf", "g": "Khi nói về các nhân tố ảnh hưởng đến hô hấp ở thực vật, mỗi phát biểu sau đây là đúng hay sai ?", "q": "Trong giới hạn nhất định, hàm lượng nước tỉ lệ thuận với cường độ hô hấp.", "o": [], "a": "ĐÚNG", "e": "Chính xác.", "b": []}, {"i": 79, "s": 3, "p": "Đúng/Sai", "n": "Câu 3 ý b", "k": "tf", "g": "", "q": "Nồng độ CO2 trong không khí càng cao, cường độ hô hấp càng tăng.", "o": [], "a": "SAI", "e": "CO2 quá cao ức chế hô hấp.", "b": []}, {"i": 80, "s": 3, "p": "Đúng/Sai", "n": "Câu 3 ý c", "k": "tf", "g": "", "q": "Đối với cây trên cạn không nên để bị ngập úng lâu ngày, vì cây sẽ hút quá nhiều nước nên bị úng chết.", "o": [], "a": "SAI", "e": "Cây úng chết do rễ thiếu O2 thối hủy.", "b": []}, {"i": 81, "s": 3, "p": "Đúng/Sai", "n": "Câu 3 ý d", "k": "tf", "g": "", "q": "Càng tăng nồng độ oxygen, cường độ hô hấp càng tăng.", "o": [], "a": "ĐÚNG", "e": "Tăng đến ngưỡng bão hòa không tăng thêm. Oxygen tỉ lệ thuận với cường độ hô hấp", "b": []}, {"i": 82, "s": 3, "p": "Trả lời ngắn", "n": "Câu 3", "k": "short", "g": "", "q": "Chu trình Krebs mỗi phân tử acetỵl-CoA (2C) phân giải thành 2 CO2, và bao nhiêu phân tử NADH?", "o": [], "a": "3", "e": "3 NADH.", "b": []}, {"i": 83, "s": 3, "p": "Trả lời ngắn", "n": "Câu 4", "k": "short", "g": "", "q": "Trong hô hấp ở thực vật, ATP được tạo ra theo mấy con đường?", "o": [], "a": "2", "e": "2 con đường: Mức cơ chất và Phosphoryl hóa hóa động.", "b": []}, {"i": 84, "s": 3, "p": "Trả lời ngắn", "n": "Câu 5", "k": "short", "g": "", "q": "Trong hô hấp hiếu khí ở thực vật, Nếu oxy hóa hòa toàn 2 phân tử glucose qua đường phân sẽ tạo ra bao nhiêu phân tử ATP?", "o": [], "a": "4", "e": "2 x 2 = 4 ATP.", "b": []}, {"i": 85, "s": 3, "p": "Trả lời ngắn", "n": "Câu 6", "k": "short", "g": "", "q": "Trong hô hấp hiếu khí ở thực vật, Nếu oxy hóa hòa toàn 2 phân tử glucose qua quá trình oxy hóa pyruvate sẽ tạo ra bao nhiêu phân tử NADH?", "o": [], "a": "4", "e": "2 x 2 = 4 NADH.", "b": []}, {"i": 86, "s": 3, "p": "Trả lời ngắn", "n": "Câu 7", "k": "short", "g": "", "q": "Trong hô hấp hiếu khí ở thực vật, Nếu oxy hóa hòa toàn 2 phân tử glucose qua chu trình Creps sẽ tạo ra bao nhiêu phân tử ATP?", "o": [], "a": "4", "e": "2 x 2 = 4 ATP.", "b": []}, {"i": 87, "s": 4, "p": "Trắc nghiệm", "n": "Câu 1", "k": "mcq", "g": "", "q": "Quá trình dinh dưỡng gồm các giai đoạn là:", "o": ["A. Lấy nước, lấy thức ăn, hấp thụ nước và đồng hóa các chất.", "B. Lấy thức ăn, tiêu hóa thức ăn, hấp thụ chất dinh dưỡng và đồng hóa các chất..", "C. Lấy thức ăn, tiêu hóa thức ăn và bài tiết chất thải.", "D. Tiêu hóa thức ăn, hấp thụ chất dinh dưỡng và đồng hóa các chất."], "a": "B. Lấy thức ăn, tiêu hóa thức ăn, hấp thụ chất dinh dưỡng và đồng hóa các chất..", "e": "Lấy thức ăn -> Tiêu hóa -> Hấp thụ -> Đồng hóa.", "b": []}, {"i": 88, "s": 4, "p": "Trắc nghiệm", "n": "Câu 2", "k": "mcq", "g": "", "q": "Ở loài động vật nào sau đây chỉ có hình thức tiêu hoá nội bào (tiêu hóa thức ăn bên trong tế bào)?", "o": ["A. Cá.", "B. Trùng giày.", "C. Ruột khoang.", "D. Cả cá, trùng giày và ruột khoang."], "a": "B. Trùng giày.", "e": "Trùng giày (ĐV đơn bào).", "b": []}, {"i": 89, "s": 4, "p": "Trắc nghiệm", "n": "Câu 5", "k": "mcq", "g": "", "q": "Khi nói về tiêu hóa nội bào, phát biểu nào sau đây là đúng?", "o": ["A. Đây là quá trình tiêu hóa hóa học ở trong tế bào và ngoài tế bào.", "B. Đây là quá trình tiêu hóa thức ăn ở trong ống tiêu hóa.", "C. Đây là quá trình tiêu hóa hóa học ở bên trong tế bào nhờ enzyme của lysosome.", "D. Đây là quá trình tiêu hóa hóa học ở bên trong ống tiêu hóa và túi tiêu hóa."], "a": "C. Đây là quá trình tiêu hóa hóa học ở bên trong tế bào nhờ enzyme của lysosome.", "e": "Tiêu hóa hóa học bên trong tế bào nhờ enzyme lysosome.", "b": []}, {"i": 90, "s": 4, "p": "Trắc nghiệm", "n": "Câu 10", "k": "mcq", "g": "", "q": "Các động vật thuộc ngành Thân lỗ có hình thức tiêu hoá?", "o": ["A. Ngoại bào.", "B. Nội bào.", "C. Ngoài cơ thể.", "D. Trong cơ thể."], "a": "B. Nội bào.", "e": "Tiêu hóa nội bào.", "b": []}, {"i": 91, "s": 5, "p": "Tự luận", "n": "Câu 1", "k": "essay", "g": "", "q": "Trong tự nhiên, ở một số cây trồng như cà rốt let cfg={rate:1,voice:'',gap:1.5,rep:1,loop:'off',opts:true,exp:true};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('sh11')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sh11',JSON.stringify(cfg))}catch(e){}};
let sec=-1,cur=0,playing=false,tok=0,rd=0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sc=()=>D.items.filter(i=>sec<0||i.s===sec).map(i=>i.i);
const sp=s=>s.replace(/\bCO2\b/g,'CO hai').replace(/H2O/g,'H hai O').replace(/\bO2\b/g,'O hai').replace(/FADH2/g,'FADH hai').replace(/NADP\+/g,'NADP cộng').replace(/NAD\+/g,'NAD cộng').replace(/NH4\+/g,'NH bốn cộng').replace(/NO3-/g,'NO ba trừ').replace(/->|→/g,', rồi ').replace(/(\d)-([a-d]+)/g,(m,d,l)=>d+' ghép '+l.split('').join(', ')).replace(/(\d)\s*x\s*(\d)/g,'$1 nhân $2').replace(/=/g,' bằng ').replace(/(\d+)oC/g,'$1 độ C').replace(/(\d)\s*[–-]\s*(\d)/g,'$1 đến $2').replace(/%/g,' phần trăm').replace(/\s+/g,' ');
function tbl(r){const h=r[0];return r.slice(1).map(x=>x[0]+': '+x.slice(1).map((c,j)=>h[j+1]+': '+c).join('; ')).join('. ')}
function texts(it){
 let a=it.n+'. '+(it.g?it.g+' ':'')+it.q.replace(/\n/g,'. ');
 if(it.k==='essay')return[a,'Trả lời. '+it.b.map(b=>b.t==='p'?b.x:tbl(b.r)).join('. ')];
 if(cfg.opts&&it.o.length)a+=' Các phương án. '+it.o.map(o=>o.replace(/^([A-D])\.\s*/,'$1: ')).join('. ');
 return[a,'Đáp án: '+it.a+'.'+(cfg.exp&&it.e?' Giải thích: '+it.e:'')]}
function ans(it){
 if(it.k==='essay')return it.b.map(b=>b.t==='p'?`<p>${esc(b.x)}</p>`:`<div class="tw"><table>${b.r.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')}</table></div>`).join('');
 return`<p><b>${esc(it.a)}</b></p>${it.e?`<p class="e">${esc(it.e)}</p>`:''}`}
function render(){
 $('#chips').innerHTML=['Tất cả',...D.secs.map(s=>s.short)].map((n,i)=>`<button class="chip${sec===i-1?' on':''}" data-s="${i-1}">${n}</button>`).join('');
 $('#desc').textContent=sec<0?'Toàn bộ đề cương · '+D.items.length+' mục':D.secs[sec].title+' · '+D.secs[sec].n+' mục';
 let h='',lp='';
 D.items.forEach(it=>{if(sec>=0&&it.s!==sec)return;const k=it.s+it.p;if(k!==lp){lp=k;h+=`<h2>${esc(D.secs[it.s].short)} · ${esc(it.p)}</h2>`}
  h+=`<article class="card" id="c${it.i}" data-i="${it.i}"><b class="n">${esc(it.n)}</b><p>${esc((it.g?it.g+'\n':'')+it.q)}</p>${it.o.length?'<ul>'+it.o.map(o=>`<li>${esc(o)}</li>`).join('')+'</ul>':''}<details><summary>Đáp án</summary>${ans(it)}</details></article>`});
 $('#list').innerHTML=h;mark()}
function mark(){
 document.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
 const c=$('#c'+cur);if(c){c.classList.add('now');if(playing)c.scrollIntoView({block:'center',behavior:'smooth'})}
 const it=D.items[cur],l=sc();$('#st').textContent=it?`${it.n} · ${D.secs[it.s].short} · ${l.indexOf(cur)+1}/${l.length}`:''}
function ui(){$('#pl').textContent=playing?'⏸ Dừng':'▶ Đọc';$('#lp').textContent='🔁 '+LN[cfg.loop]}
function chunks(t){const o=[];let b='';(sp(t).match(/[^.;!?]+[.;!?]*/g)||[t]).forEach(s=>{if((b+s).length>150&&b){o.push(b);b=s}else b+=s});if(b)o.push(b);return o}
function say(t,my,cb){const ch=chunks(t);let k=0;
 const nx=()=>{if(my!==tok)return;if(k>=ch.length)return cb();const u=new SpeechSynthesisUtterance(ch[k++]);u.lang='vi-VN';u.rate=+cfg.rate;
  const v=speechSynthesis.getVoices().find(v=>v.name===cfg.voice);if(v)u.voice=v;u.onend=nx;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')nx()};speechSynthesis.speak(u)};nx()}
function play(){const my=++tok;speechSynthesis.cancel();mark();const[a,b]=texts(D.items[cur]);
 say(a,my,()=>setTimeout(()=>{if(my!==tok)return;say(b,my,()=>setTimeout(()=>{if(my===tok)after()},800))},cfg.gap*1000))}
function after(){
 if(++rd<+cfg.rep)return play();rd=0;
 if(cfg.loop==='one')return play();
 const l=sc(),p=l.indexOf(cur);
 if(p<l.length-1){cur=l[p+1];return play()}
 if(cfg.loop==='list'){cur=l[0];return play()}
 stop()}
function start(){if(!('speechSynthesis'in window)){$('#st').textContent='Trình duyệt không hỗ trợ đọc. Hãy dùng Canva AI Voice.';return}playing=true;rd=0;ui();play()}
function stop(){playing=false;tok++;try{speechSynthesis.cancel()}catch(e){}ui()}
function mv(d){const l=sc();let p=l.indexOf(cur);if(p<0)p=0;cur=l[(p+d+l.length)%l.length];rd=0;playing?play():mark()}
$('#pl').onclick=()=>playing?stop():start();$('#pv').onclick=()=>mv(-1);$('#nx').onclick=()=>mv(1);
$('#gs').onclick=()=>$('#set').classList.toggle('open');
$('#lp').onclick=()=>{cfg.loop={off:'one',one:'list',list:'off'}[cfg.loop];save();ui();document.querySelector('[data-k=loop]').value=cfg.loop};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;stop();sec=+b.dataset.s;cur=sc()[0];render();scrollTo({top:0})};
$('#list').onclick=e=>{const c=e.target.closest('.card');if(!c||e.target.closest('details'))return;cur=+c.dataset.i;start()};
$('#cp').onclick=async()=>{const t=sc().map(i=>texts(D.items[i]).map(sp).join('\n')).join('\n\n');
 try{await navigator.clipboard.writeText(t);$('#cp').textContent='Đã sao chép'}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');$('#cp').textContent='Đã sao chép'}catch(x){$('#cp').textContent='Không sao chép được'}a.remove()}
 setTimeout(()=>$('#cp').textContent='Sao chép kịch bản',2000)};
function voices(){const vs=speechSynthesis.getVoices(),vi=vs.filter(v=>/^vi/i.test(v.lang));
 $('#vo').innerHTML='<option value="">Mặc định</option>'+(vi.length?vi:vs).map(v=>`<option value="${esc(v.name)}">${esc(v.name)}</option>`).join('');$('#vo').value=cfg.voice}
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(el.type==='checkbox')el.checked=cfg[k];else el.value=cfg[k];
 el.onchange=el.oninput=()=>{cfg[k]=el.type==='checkbox'?el.checked:el.value;save();ui()}});
if('speechSynthesis'in window){voices();speechSynthesis.onvoiceschanged=voices}
cur=0;render();ui();
</script></body></html>
